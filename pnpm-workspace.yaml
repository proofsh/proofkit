packages:
  - apps/*
  - packages/*
  - "!packages/cli-old"
  - "!packages/tmp"
  - packages/typegen/web
allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  core-js: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
